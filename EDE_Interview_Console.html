<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDE — Research Session Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#082B21; --deep2:#0C3629; --deep3:#175040;
    --paper:#FBFCFB; --mist:#F2F5F3; --ink:#10231D;
    --em:#17A06E; --em-d:#0E7D55; --em-deep:#093528;
    --amber:#E0A500; --sky:#4DA3D6; --rose:#D93025; --ok:#2E9E5B;
    --mut:#7FA294; --line:#D8E2DC; --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'IBM Plex Sans','Noto Sans Arabic',system-ui,sans-serif;
    background:var(--deep);color:var(--mist);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  html[dir="rtl"] body{font-family:'Noto Sans Arabic','IBM Plex Sans',system-ui,sans-serif}
  html[dir="rtl"] .lat{font-family:'IBM Plex Sans',sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit}

  header{
    height:64px;display:flex;align-items:center;gap:20px;padding:0 20px;
    border-bottom:1px solid var(--deep3);background:var(--deep);position:relative;z-index:20;
  }
  .mark{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .logochip{background:#fff;border-radius:9px;padding:3px 8px;display:flex;align-items:center;flex-shrink:0}
  .glyph{height:42px;width:auto;flex-shrink:0;display:block}
  .subttl{
    font-size:11px;color:var(--mut);letter-spacing:.04em;
    border-inline-start:1px solid var(--deep3);padding-inline-start:20px;white-space:nowrap;
  }
  .clockwrap{margin-inline-start:auto;display:flex;align-items:center;gap:12px}
  .clock{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:30px;line-height:1;
    min-width:118px;text-align:end;direction:ltr;
  }
  .clock.warn{color:var(--amber)} .clock.bad{color:var(--rose)}
  .clocklbl{font-size:10px;color:var(--mut);letter-spacing:.06em;text-align:end;margin-top:3px}
  .tbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--em);color:#fff;transition:.15s;flex-shrink:0}
  .tbtn:hover{background:var(--em-d)}
  .tbtn.ghost{background:transparent;border:1px solid var(--deep3);color:var(--mut)}
  .tbtn.ghost:hover{border-color:var(--em);color:var(--em)}
  .hbtn{font-size:12px;font-weight:600;padding:9px 14px;border-radius:var(--r);border:1px solid var(--deep3);color:var(--mist);transition:.15s;white-space:nowrap}
  .hbtn:hover{border-color:var(--em);color:var(--em)}
  .hbtn.solid{background:var(--em);border-color:var(--em);color:#fff}
  .hbtn.solid:hover{background:var(--em-d);border-color:var(--em-d)}
  .langtog{display:flex;border:1px solid var(--deep3);border-radius:var(--r);overflow:hidden;flex-shrink:0}
  .langtog button{font-family:'IBM Plex Sans',sans-serif;font-size:11.5px;font-weight:700;padding:9px 12px;color:var(--mut);transition:.15s}
  .langtog button.on{background:var(--mist);color:var(--deep)}

  .shell{display:flex;height:calc(100vh - 64px)}
  aside{width:296px;flex-shrink:0;background:var(--deep2);border-inline-end:1px solid var(--deep3);overflow-y:auto;padding:18px 0 40px}
  main{flex:1;overflow-y:auto;background:var(--deep);padding:26px 30px 90px}
  .stage{max-width:830px;margin:0 auto}

  .rail-h{font-size:10px;letter-spacing:.1em;color:#6C917F;padding:0 18px 9px;font-weight:700}
  .setup{padding:0 18px 16px;border-bottom:1px solid var(--deep3);margin-bottom:16px}
  .fld{margin-bottom:9px}
  .fld label{display:block;font-size:10px;color:#6C917F;margin-bottom:4px}
  .fld input,.fld select{width:100%;background:var(--deep);border:1px solid var(--deep3);color:var(--mist);padding:8px 9px;border-radius:7px;font-size:12.5px;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--em)}
  .fld select option{background:var(--deep);color:var(--mist)}

  .steps{padding:0 10px}
  .step{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:8px;cursor:pointer;transition:.12s;position:relative}
  .step:hover{background:var(--deep3)}
  .step.on{background:var(--em)}
  .step.on .s-t{color:#fff} .step.on .s-w{color:#fff;opacity:.85}
  .step.done .s-dot{background:var(--ok);border-color:var(--ok)}
  .s-dot{width:9px;height:9px;border-radius:50%;border:1.5px solid #4E7A69;margin-top:5px;flex-shrink:0}
  .step.on .s-dot{background:#fff;border-color:#fff}
  .s-t{font-size:12.5px;font-weight:600;line-height:1.4}
  .s-w{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#6C917F;margin-top:2px;direction:ltr;text-align:start}
  .s-pace{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:700;color:var(--amber)}

  .pacebar{margin:14px 18px 0;padding:10px 12px;border-radius:8px;font-size:11.5px;line-height:1.5;display:none}
  .pacebar.show{display:block}
  .pacebar.behind{background:rgba(224,165,0,.15);border:1px solid rgba(224,165,0,.4);color:#F0C860}
  .pacebar.over{background:rgba(217,48,37,.15);border:1px solid rgba(217,48,37,.45);color:#F08880}

  .p-head{display:flex;align-items:baseline;gap:12px;margin-bottom:5px;flex-wrap:wrap}
  .p-num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:var(--em);letter-spacing:.08em}
  h1{font-family:'Archivo','Noto Sans Arabic',sans-serif;font-size:27px;font-weight:700;line-height:1.25}
  .p-win{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--mut);border:1px solid var(--deep3);padding:3px 9px;border-radius:20px;direction:ltr}
  .p-reads{font-size:13px;color:var(--mut);margin-bottom:22px;line-height:1.5}

  .say{background:var(--em-deep);color:#E8F1EC;border-inline-start:5px solid var(--em);padding:18px 20px;border-radius:var(--r);margin-bottom:22px}
  .say .lbl{font-size:10px;letter-spacing:.1em;font-weight:700;color:#8FB8A6;margin-bottom:8px}
  .say p{font-size:15.5px;line-height:1.85;margin-bottom:10px}
  .say p:last-child{margin-bottom:0}

  .q{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:15px 17px;margin-bottom:11px;transition:.15s;border:2px solid transparent}
  .q.flagged{border-color:var(--amber)}
  .q-top{display:flex;gap:11px;align-items:flex-start}
  .q-n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;color:#0E4D3C;background:#EAF3EF;border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:2px;direction:ltr}
  .q-t{flex:1;font-size:16px;line-height:1.65;font-weight:500}
  .q-star{flex-shrink:0;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#C6CFC9;transition:.15s}
  .q-star:hover{background:#FDF4E3;color:var(--amber)}
  .q-star.on{color:var(--amber)}
  .rt{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;font-weight:600;padding:2px 8px;border-radius:5px;margin-top:2px;flex-shrink:0;direction:ltr}
  .rt.validates{background:#EAF3EF;color:#0E4D3C}
  .rt.phase2{background:#E9F2F8;color:#1B5F8A}
  .rt.trust{background:#FDF4E3;color:#C47F17}
  .probe{margin:9px 0 0 0;margin-inline-start:44px;font-size:13px;line-height:1.7;color:#5C6F68;padding-inline-start:10px;border-inline-start:2px solid #D8E2DC}
  .q-note{width:100%;margin-top:11px;background:#F2F5F3;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;line-height:1.7;color:var(--ink);resize:vertical;min-height:36px;outline:none}
  .q-note:focus{border-color:var(--em);background:#fff}
  .q-note::placeholder{color:#A9BBB2}
  .tags{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
  .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:#7A8A83;transition:.12s}
  .tag:hover{border-color:var(--em);color:var(--em-d);background:#EAF3EF}

  /* usability task card */
  .task{background:var(--paper);color:var(--ink);border-radius:var(--r);margin-bottom:14px;overflow:hidden;border:2px solid transparent}
  .task.flagged{border-color:var(--amber)}
  .t-head{display:flex;gap:12px;align-items:flex-start;padding:15px 17px 12px}
  .t-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;color:#0E4D3C;line-height:1.15;min-width:38px;direction:ltr}
  .t-title{flex:1;font-size:16px;font-weight:600;line-height:1.5}
  .t-script{margin:0 17px 10px;background:var(--mist);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.7}
  .t-script .lbl2{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;font-weight:600;color:#8A7A5C;margin-bottom:3px}
  .t-meta{margin:0 17px 12px;font-size:12.5px;line-height:1.65;color:#5C6F68}
  .t-meta b{color:#0E4D3C}
  .t-ctrls{display:flex;flex-wrap:wrap;gap:16px;padding:12px 17px;background:#F7FAF8;border-top:1px dashed var(--line);align-items:flex-end}
  .cg{display:flex;flex-direction:column;gap:5px}
  .cg .cl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;font-weight:600;color:#8A7A5C}
  .ttimer{display:flex;align-items:center;gap:8px}
  .ttimer .tdisp{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;min-width:56px;direction:ltr}
  .sbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--ink);transition:.12s}
  .sbtn:hover{border-color:var(--em);color:var(--em-d)}
  .sbtn.running{background:var(--em);color:#fff;border-color:var(--em)}
  .seg{display:flex;gap:5px}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;min-width:32px;color:var(--ink);transition:.12s}
  .seg button:hover{border-color:var(--em)}
  .seg button.sel{background:var(--em-d);color:#fff;border-color:var(--em-d)}
  .seg.pf button[data-v="fail"].sel{background:var(--rose);border-color:var(--rose)}
  .seg.pf button[data-v="assist"].sel{background:var(--amber);border-color:var(--amber)}
  .seg.sq button.sel{background:#1B5F8A;border-color:#1B5F8A}
  .task .q-note{width:calc(100% - 34px);margin:11px 17px 6px}
  .task .tags{margin:0 17px 14px}
  .task .q-star{margin-top:0}

  .nav{display:flex;gap:10px;margin-top:26px}
  .nav button{flex:1;padding:13px;border-radius:var(--r);font-size:13.5px;font-weight:600;border:1px solid var(--deep3);color:var(--mist);transition:.15s}
  .nav button:hover:not(:disabled){border-color:var(--em);color:var(--em)}
  .nav button.solid{background:var(--em);border-color:var(--em);color:#fff}
  .nav button.solid:hover{background:var(--em-d);border-color:var(--em-d)}
  .nav button:disabled{opacity:.3;cursor:not-allowed}

  .note-lbl{font-size:10.5px;letter-spacing:.08em;color:#6C917F;font-weight:700;margin:24px 0 10px}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;bottom:0;width:500px;max-width:93vw;
    background:var(--paper);color:var(--ink);z-index:50;overflow-y:auto;padding:24px 26px 60px;
    transition:transform .25s cubic-bezier(.4,0,.2,1);
  }
  html[dir="rtl"] .drawer{left:0;transform:translateX(-101%)}
  html[dir="ltr"] .drawer{right:0;transform:translateX(101%)}
  .drawer.on{transform:translateX(0) !important}
  .drawer h2{font-family:'Archivo','Noto Sans Arabic',sans-serif;font-size:19px;color:var(--em-deep);margin-bottom:4px}
  .drawer h3{font-size:11px;letter-spacing:.08em;color:var(--em-d);font-weight:700;margin:26px 0 11px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .drawer ol,.drawer ul{padding-inline-start:19px}
  .drawer li{font-size:13.5px;line-height:1.75;margin-bottom:10px}
  .dclose{position:absolute;top:18px;inset-inline-end:20px;font-size:24px;color:#7A8A83}
  .dclose:hover{color:var(--em)}
  table.ban{width:100%;border-collapse:collapse;font-size:12px}
  table.ban th{text-align:start;background:var(--em-deep);color:var(--mist);padding:7px 8px;font-weight:600;font-size:10.5px}
  table.ban td{padding:8px;border-bottom:1px solid var(--line);line-height:1.55;vertical-align:top}
  table.ban td.b{color:var(--rose);font-weight:500}
  table.ban td.g{color:#0E7D55;font-weight:500}
  .sevrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
  .sevrow .sn{font-family:'Archivo',sans-serif;font-weight:800;font-size:19px;min-width:26px;direction:ltr}
  .sevrow .st{font-size:13px;line-height:1.6}
  .sevrow .st b{display:block}
  .sevrow.s0 .sn{color:#8AA39A}.sevrow.s1 .sn{color:#8A7A5C}.sevrow.s2 .sn{color:#1B5F8A}.sevrow.s3 .sn{color:#C47F17}.sevrow.s4 .sn{color:var(--rose)}
  .precommit{background:#EAF3EF;border-inline-start:4px solid var(--em-d);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.7;font-weight:600;margin-top:10px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mini2{border:1px solid var(--line);border-radius:9px;padding:11px;font-size:12.5px}
  .mini2 h4{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;margin-bottom:7px}
  .mini2.yes h4{color:#0E7D55}.mini2.no h4{color:var(--rose)}
  .mini2 ul{list-style:none;padding:0}
  .mini2 li{padding:2px 0 2px 16px;position:relative;line-height:1.55;margin-bottom:2px;font-size:12.5px}
  html[dir="rtl"] .mini2 li{padding:2px 16px 2px 0}
  .mini2.yes li::before{content:"—";position:absolute;inset-inline-start:0;color:#0E7D55}
  .mini2.no li::before{content:"✕";position:absolute;inset-inline-start:0;color:var(--rose);font-size:10px;top:5px}

  .toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%) translateY(80px);background:var(--ok);color:#fff;padding:11px 20px;border-radius:var(--r);font-size:13px;font-weight:600;z-index:99;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  html[dir="ltr"] .toast{transform:translateX(-50%) translateY(80px)}
  .toast.on{transform:translateX(50%) translateY(0)}
  html[dir="ltr"] .toast.on{transform:translateX(-50%) translateY(0)}
  .tbtn.rec{background:var(--rose);color:#fff;animation:recpulse 1.7s infinite}
  .tbtn.rec:hover{background:#B8281E}
  @keyframes recpulse{0%,100%{box-shadow:0 0 0 0 rgba(217,48,37,.55)}50%{box-shadow:0 0 0 8px rgba(217,48,37,0)}}
  .hbtn.tron{border-color:var(--em);color:var(--em)}
  .trpanel{
    position:fixed;bottom:0;inset-inline:0;z-index:35;background:var(--deep2);
    border-top:1px solid var(--deep3);transform:translateY(103%);transition:transform .25s;
    display:flex;flex-direction:column;max-height:42vh;box-shadow:0 -12px 34px rgba(0,0,0,.4);
  }
  .trpanel.on{transform:none}
  .tr-head{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--deep3);flex-shrink:0}
  .tr-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--em);white-space:nowrap}
  .tr-hint{font-size:10.5px;color:var(--mut);line-height:1.55;flex:1}
  .tr-close{font-size:20px;color:var(--mut);padding:0 6px;flex-shrink:0}
  .tr-close:hover{color:var(--em)}
  .tr-body{overflow-y:auto;padding:10px 18px 16px;font-size:13.5px;line-height:1.85;min-height:64px}
  .tr-line{margin-bottom:3px}
  .tr-line .tt{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--em);direction:ltr;unicode-bidi:embed;display:inline-block;margin-inline-end:9px}
  .tr-interim{color:#8FB8A6;font-style:italic}
  .tr-empty{color:#6C917F;font-size:12.5px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--deep3);border-radius:9px}
  @media(max-width:1230px){.subttl{display:none}}
  @media(max-width:900px){aside{display:none}main{padding:20px 16px 80px}.subttl{display:none}}
</style>
</head>

  ],
  rules:[
    'Every interview question anchors on the participant’s <b>current reality</b> or their <b>future wishes</b> — never on the closed design artifact. The design appears only in the usability test, where the only questions are task-based.',
    'If a participant volunteers a design critique: acknowledge it, tag it <b>PHASE 2</b>, and redirect — <i>“That’s useful — noted for the roadmap. Let me take you back to…”</i> Never probe deeper on unsolicited design opinions.',
    'Do not say <b>“the design is final”</b> or “we can’t change anything” — it deflates honesty. The scope control happens in the questions and the severity gate, not in the disclaimer.',
    'Probe with <b>TEDW</b> only: <i>Tell me… / Explain… / Describe… / Walk me through…</i>',
    'In the usability test: task instructions only. After each task, exactly one rating — the SEQ. If you helped, the result is <b>Assisted</b>, not Pass.',
    'You can’t answer questions during a task. Help afterwards if they get stuck — and log where they got stuck.',
    'Arabic sessions get an Arabic-speaking moderator — trust is built before insight is shared. Run the test on mobile: 90%+ of MENA traffic is mobile.',
    '5–6 participants surface ~85% of major usability issues (Nielsen). This is a qualitative launch-readiness study — do not let stakeholders demand n&gt;30 for this format.',
    'Present this study as a <b>launch-readiness check + Phase 2 discovery</b>, never as “user validation of the designs.” The same findings read as a roadmap in the first frame and as a blocker in the second.'
  ],
  bans:[
    ['What do you think of this design?','Invites opinion; you get politeness, not truth.','Run the task. Record success, time, errors, SEQ.'],
    ['What’s missing? / How would you improve this page?','Generates change requests against a closed design.','Q7 — day-one expectations, asked before any design is shown.'],
    ['Do you prefer A or B?','Preference isn’t behaviour; it reopens decided questions.','Watch what they do in the task; log friction with a severity rating.'],
    ['Would you use the scan feature?','Hypothetical yes — everyone agrees, nobody commits.','Q8 — “when exactly would you use it, and what would stop you?”'],
    ['Any final thoughts on the design?','One question that undoes the session’s entire scope discipline.','Close with the script and stop.']
  ],
  sev:[
    ['0','Not a problem','No action.'],
    ['1','Cosmetic','Backlog. Phase 2 consideration only.'],
    ['2','Minor','Backlog. Prioritised in Phase 2 roadmap.'],
    ['3','Major','Blocks task success for some users. Fixed before launch.'],
    ['4','Catastrophic','Prevents core task completion. Fixed before launch, no exceptions.']
  ],
  precommit:'“Findings rated Severity 3–4 will be corrected before launch. Findings rated Severity 0–2, and all opportunity insights from interviews, are logged to the Phase 2 roadmap and do not affect the current approved design or its timeline.” — agreed in writing, before fieldwork begins.',
  after:[
    'Affinity-map interview notes into themes → tag each theme <b>VALIDATES</b> or <b>PHASE 2</b>. No finding leaves synthesis without a routing tag.',
    'Rank Phase 2 items by Q11 votes and segment weight.',
    '<b>Launch-readiness scorecard</b> — task success, SEQ, timings, severity log → evidence the approved design performs; unblocks approval.',
    '<b>Validation evidence sheet</b> — Q1–Q7 themes mapped to shipped features → shows each feature answers a real, observed behaviour.',
    '<b>Phase 2 opportunity roadmap</b> — Q8–Q11 + all Sev 0–2 items + volunteered ideas → the innovation narrative for the ministry-pathway story.'
  ]
},

/* ═══════════════════ TIMERS ═══════════════════ */

const elapsed = ()=> S.t.run ? S.t.base + (Date.now()-S.t.from) : S.t.base;
const tElapsed = k=>{ const t=S.tasks[k]; return t.run ? t.base + (Date.now()-t.from) : t.base; };
const fmt = ms => { const s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };

function tick(){
  const u=U(), ms=elapsed(), min=ms/60000, c=$('clock');
  c.textContent = fmt(ms);
  c.className = 'clock' + (min>55?' bad': min>50?' warn':'');
  $('clocklbl').textContent = min>55 ? u.over : u.cap;

  // task timers on screen
  document.querySelectorAll('[data-tdisp]').forEach(el=>{
    el.textContent = fmt(tElapsed(el.dataset.tdisp));
  });

  const bar=$('pacebar');
  const M = D().main;
  let should=0; M.forEach((p,i)=>{ if(min>=p.s) should=i; });
  if(min>55){ bar.className='pacebar show over'; bar.innerHTML=u.overBar; }
  else if(should>S.idx && min>4){
    const behind = Math.round(min - M[S.idx].e);
    if(behind>0){ bar.className='pacebar show behind'; bar.innerHTML=u.behind(behind, (S.L==='ar'?'القسم ':'Section ')+M[should].id); }
    else bar.className='pacebar';
  } else bar.className='pacebar';
  renderSteps(should);
}
setInterval(tick,500);

$('play').onclick = ()=>{
  if(S.t.run){ S.t.base=elapsed(); S.t.run=false; } else { S.t.from=Date.now(); S.t.run=true; }
  $('playIcon').innerHTML = S.t.run
    ? '<rect x="4" y="2.5" width="3" height="11"/><rect x="9" y="2.5" width="3" height="11"/>'
    : '<path d="M4 2.5v11l9-5.5-9-5.5z"/>';
  tick();
};
$('reset').onclick = ()=>{
  if(!confirm(U().resetConfirm)) return;
  if(R.on) stopRec();
  S.t={run:false,base:0,from:0};
  S.notes={}; S.flags={}; S.idx=0;
  R.lines=[]; R.interim='';
  seedTasks();
  $('pid').value=''; $('mod').value=''; $('seg').value=''; $('dev').selectedIndex=0;
  try{ localStorage.removeItem(SAVEKEY); }catch(e){}
  $('playIcon').innerHTML='<path d="M4 2.5v11l9-5.5-9-5.5z"/>';
  chrome(); render(); tick();
};

/* ═══════════════════ RAIL ═══════════════════ */

function renderSteps(pace){
  const u=U(), P=parts();
  $('railTitle').textContent = u.partsLbl;
  $('steps').innerHTML = P.map((p,i)=>{
    const on=i===S.idx, done=i<S.idx;
    const mark = (pace===i && !on) ? '<div class="s-pace">'+u.beHere+'</div>' : '';
    const win = String(p.s).padStart(2,'0')+':00 – '+String(p.e).padStart(2,'0')+':00';
    return '<div class="step'+(on?' on':'')+(done?' done':'')+'" data-i="'+i+'">'
      +'<div class="s-dot"></div><div style="flex:1"><div class="s-t"><span class="lat" style="direction:ltr;unicode-bidi:isolate">'+p.id+'</span> — '+p.title+'</div>'
      +'<div class="s-w">'+win+'</div></div>'+mark+'</div>';
  }).join('');
  [...$('steps').children].forEach(el=> el.onclick=()=>{ S.idx=+el.dataset.i; render(); });
}

/* ═══════════════════ STAGE ═══════════════════ */

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function qBlock(q){
  const u=U(), n=q[0], key='q:'+n, f=S.flags[key];
  const probes = q[2]||[];
  return '<div class="q'+(f?' flagged':'')+'">'
    +'<div class="q-top"><div class="q-n">Q'+n+'</div><div class="q-t">'+esc(q[1])
      +(q[3]?'<div style="margin-top:6px"><span class="rt '+q[3]+'">'+q[3].toUpperCase().replace('PHASE2','PHASE 2')+' → '+esc(q[4]||'')+'</span></div>':'')
    +'</div>'
    +'<button class="q-star'+(f?' on':'')+'" data-star="'+key+'"><svg width="15" height="15" viewBox="0 0 16 16" fill="'+(f?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5l1.9 4 4.3.6-3.1 3 .8 4.3L8 11.4 4.1 13.4l.8-4.3-3.1-3 4.3-.6L8 1.5z"/></svg></button></div>'
    +probes.map(p=>'<div class="probe">↳ '+esc(p)+'</div>').join('')
    +'<textarea class="q-note" data-note="'+key+'" placeholder="'+u.notesPh+'">'+esc(S.notes[key]||'')+'</textarea>'
    +'<div class="tags">'+u.tags.map((t,i)=>'<button class="tag" data-tag="'+key+'|'+i+'">'+t+'</button>').join('')+'</div>'
  +'</div>';
}

function taskBlock(t){
  const u=U(), id=t[0], key='t:'+id, st=S.tasks[id], f=S.flags[key];
  const pfB = v=>'<button data-pf="'+id+'|'+v+'"'+(st.pf===v?' class="sel"':'')+'>'+u[v]+'</button>';
  let sq=''; for(let i=1;i<=7;i++) sq+='<button data-seq="'+id+'|'+i+'"'+(st.seq===i?' class="sel"':'')+'>'+i+'</button>';
  return '<div class="task'+(f?' flagged':'')+'">'
    +'<div class="t-head"><div class="t-num">'+id+'</div><div class="t-title">'+esc(t[1])+'</div>'
    +'<button class="q-star'+(f?' on':'')+'" data-star="'+key+'"><svg width="15" height="15" viewBox="0 0 16 16" fill="'+(f?'currentColor':'none')+'" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5l1.9 4 4.3.6-3.1 3 .8 4.3L8 11.4 4.1 13.4l.8-4.3-3.1-3 4.3-.6L8 1.5z"/></svg></button></div>'
    +'<div class="t-script"><span class="lbl2">'+u.sayExactly+'</span>“'+esc(t[2])+'”</div>'
    +'<div class="t-meta"><b>'+u.successL+':</b> '+esc(t[3])+' <b>'+u.watchL+':</b> '+esc(t[4])+'</div>'
    +'<div class="t-ctrls">'
      +'<div class="cg"><span class="cl">'+u.timerL+'</span><div class="ttimer"><span class="tdisp" data-tdisp="'+id+'">'+fmt(tElapsed(id))+'</span>'
        +'<button class="sbtn'+(st.run?' running':'')+'" data-tstart="'+id+'">'+(st.run?u.stopL:u.startL)+'</button>'
        +'<button class="sbtn" data-treset="'+id+'">'+u.resetL+'</button></div></div>'
      +'<div class="cg"><span class="cl">'+u.resultL+'</span><div class="seg pf">'+pfB('pass')+pfB('assist')+pfB('fail')+'</div></div>'
      +'<div class="cg" style="flex:1;min-width:230px"><span class="cl">'+u.seqL+'</span><div class="seg sq">'+sq+'</div></div>'
    +'</div>'
    +'<textarea class="q-note" data-note="'+key+'" placeholder="'+u.taskNotesPh+'">'+esc(S.notes[key]||'')+'</textarea>'
    +'<div class="tags">'+u.tags.map((tg,i)=>'<button class="tag" data-tag="'+key+'|'+i+'">'+tg+'</button>').join('')+'</div>'
  +'</div>';
}

function render(){
  const u=U(), P=parts(), p=P[S.idx];
  let h='';
  h += '<div class="p-head"><div class="p-num lat">'+(S.L==='ar'?'القسم ':'SECTION ')+p.id+'</div>'
    +'<h1>'+esc(p.title)+'</h1>'
    +'<div class="p-win">'+String(p.s).padStart(2,'0')+':00 – '+String(p.e).padStart(2,'0')+':00</div>'
    +'</div><div class="p-reads">'+p.reads+'</div>';

  if(p.say) h += '<div class="say"><div class="lbl">'+u.sayLbl+'</div>'
    + p.say.split('\n').map(x=>'<p>'+esc(x)+'</p>').join('') + '</div>';

  if(p.tasks) h += p.tasks.map(taskBlock).join('');
  h += p.qs.map(qBlock).join('');

  h += '<div class="nav"><button id="prev"'+(S.idx===0?' disabled':'')+'>'+u.prev+'</button>'
    + '<button id="next" class="solid"'+(S.idx===P.length-1?' disabled':'')+'>'+u.next+'</button></div>';

  $('stage').innerHTML = h;
  bind();
  document.querySelector('main').scrollTop = 0;
  renderSteps();
}

function bind(){
  const P=parts();
  if($('prev')) $('prev').onclick=()=>{ if(S.idx>0){S.idx--;render();} };
  if($('next')) $('next').onclick=()=>{ if(S.idx<P.length-1){S.idx++;render();} };
  $('stage').querySelectorAll('[data-note]').forEach(t=>{
    t.oninput=()=>{ S.notes[t.dataset.note]=t.value; grow(t); save(); }; grow(t);
  });
  $('stage').querySelectorAll('[data-star]').forEach(b=>{
    b.onclick=()=>{ S.flags[b.dataset.star]=!S.flags[b.dataset.star]; render(); save(); };
  });
  $('stage').querySelectorAll('[data-tag]').forEach(b=>{
    b.onclick=()=>{
      const [k,i]=b.dataset.tag.split('|');
      const ta=$('stage').querySelector('[data-note="'+k+'"]');
      const tag=U().tags[+i];
      ta.value = (ta.value && !ta.value.endsWith('\n') ? ta.value+'\n' : ta.value) + tag + ': ';
      S.notes[k]=ta.value; ta.focus(); grow(ta); save();
    };
  });
  // task controls
  $('stage').querySelectorAll('[data-tstart]').forEach(b=>{
    b.onclick=()=>{
      const t=S.tasks[b.dataset.tstart];
      if(t.run){ t.base=tElapsed(b.dataset.tstart); t.run=false; }
      else { t.from=Date.now(); t.run=true; if(!S.t.run) $('play').click(); }
      render(); save();
    };
  });
  $('stage').querySelectorAll('[data-treset]').forEach(b=>{
    b.onclick=()=>{ const t=S.tasks[b.dataset.treset]; t.base=0; t.run=false; render(); save(); };
  });
  $('stage').querySelectorAll('[data-pf]').forEach(b=>{
    b.onclick=()=>{
      const [id,v]=b.dataset.pf.split('|');
      S.tasks[id].pf = S.tasks[id].pf===v ? null : v;
      render(); save();
    };
  });
  $('stage').querySelectorAll('[data-seq]').forEach(b=>{
    b.onclick=()=>{
      const [id,v]=b.dataset.seq.split('|');
      S.tasks[id].seq = S.tasks[id].seq===+v ? 0 : +v;
      render(); save();
    };
  });
}
const grow = t => {
  if(!t.clientWidth) return;
  t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px';
};
window.addEventListener('resize', ()=> document.querySelectorAll('.q-note').forEach(grow));

  const u=U(), b=$('recBtn');
  b.classList.toggle('rec', R.on);
  b.classList.toggle('ghost', !R.on);
  b.title = R.on ? u.recStop : u.recTitle;
  b.innerHTML = R.on ? STOP_SVG : MIC_SVG;
}

function paintTr(){
  const u=U(), b=$('trBody');
  let h = R.lines.map(l=>'<div class="tr-line"><span class="tt">'+l.at+'</span>'+esc(l.tx)+'</div>').join('');
  if(R.interim) h += '<div class="tr-line tr-interim"><span class="tt">···</span>'+esc(R.interim)+'</div>';
  b.innerHTML = h || '<div class="tr-empty">'+u.trEmpty+'</div>';
  b.scrollTop = b.scrollHeight;
}

function addLine(tx){
  R.lines.push({at:fmt(elapsed()), tx:tx});
  paintTr(); save();
}

function startRecog(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast(U().srNo); return; }
  const r = new SR();
  r.lang = recLang2(); r.continuous = true; r.interimResults = true;
  r.onresult = e=>{
    let interim='';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const res=e.results[i];
      if(res.isFinal){ const tx=res[0].transcript.trim(); if(tx) addLine(tx); }
      else interim += res[0].transcript;
    }
    R.interim = interim.trim(); paintTr();
  };
  r.onend = ()=>{ if(R.wantRecog){ r.lang = recLang2(); try{ r.start(); }catch(e){} } };
  r.onerror = e=>{ if(e.error==='not-allowed' || e.error==='service-not-allowed') R.wantRecog=false; };
  R.recog = r; R.wantRecog = true;
  try{ r.start(); }catch(e){}
}

async function startRec(){
  const u=U();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast(u.srNo); return; }
  let mic;
  try{ mic = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast(u.recDenied); return; }
  let disp=null;
  try{ disp = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true}); }catch(e){}
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  const dest = ctx.createMediaStreamDestination();
  ctx.createMediaStreamSource(mic).connect(dest);
  let tabAudio=false;
  if(disp){
    if(disp.getAudioTracks().length){
      tabAudio=true;
      ctx.createMediaStreamSource(new MediaStream(disp.getAudioTracks())).connect(dest);
      const vt=disp.getVideoTracks()[0];
      if(vt) vt.onended = ()=>{ if(R.on) toast(U().recNoTab); };
    } else {
      disp.getTracks().forEach(t=>t.stop()); disp=null;
    }
  }
  if(!tabAudio) toast(u.recNoTab);
  const mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(m=>window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  const rec = new MediaRecorder(dest.stream, mime?{mimeType:mime}:undefined);
  R.chunks=[];
  rec.ondataavailable = e=>{ if(e.data && e.data.size) R.chunks.push(e.data); };
  rec.onstop = saveAudio;
  rec.start(1000);
  Object.assign(R, {on:true, mic:mic, disp:disp, ctx:ctx, recorder:rec});
  startRecog();
  if(!S.t.run) $('play').click();
  $('trpanel').classList.add('on'); $('trBtn').classList.add('tron');
  recUI(); paintTr();
}

function stopRec(){
  R.on=false; R.wantRecog=false;
  try{ if(R.recog) R.recog.stop(); }catch(e){}
  try{ if(R.recorder && R.recorder.state!=='inactive') R.recorder.stop(); }catch(e){}
  [R.mic, R.disp].forEach(s=>{ if(s) s.getTracks().forEach(t=>t.stop()); });
  if(R.ctx){ try{ R.ctx.close(); }catch(e){} }
  R.mic=R.disp=R.ctx=null; R.interim='';
  recUI(); paintTr(); save();
}

function saveAudio(){
  if(!R.chunks.length) return;
  const type = (R.recorder && R.recorder.mimeType) || 'audio/webm';
  const blob = new Blob(R.chunks, {type:type});
  R.chunks=[];
  const pid = ($('pid').value||'P-XX').replace(/\s+/g,'-');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='EDE_'+pid+'_audio_'+stamp+(type.indexOf('mp4')>-1?'.m4a':'.webm');
  a.click();
  toast(U().recSaved);
}

$('recBtn').onclick = ()=>{ R.on ? stopRec() : startRec(); };
$('trBtn').onclick = ()=>{
  const on = $('trpanel').classList.toggle('on');
  $('trBtn').classList.toggle('tron', on);
};
$('trClose').onclick = ()=>{ $('trpanel').classList.remove('on'); $('trBtn').classList.remove('tron'); };
$('lang').addEventListener('change', ()=>{ if(R.wantRecog && R.recog){ try{ R.recog.stop(); }catch(e){} } });

/* ═══════════════════ PERSISTENCE ═══════════════════ */

const SAVEKEY='ede_console_v1';
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      const tk={};
      Object.keys(S.tasks).forEach(k=>{ const t=S.tasks[k]; tk[k]={base:tElapsed(k),pf:t.pf,seq:t.seq}; });
      localStorage.setItem(SAVEKEY, JSON.stringify({
        L:S.L, idx:S.idx, notes:S.notes, flags:S.flags, tasks:tk,
        base:elapsed(), lines:R.lines,
        f:{pid:$('pid').value, mod:$('mod').value, seg:$('seg').value, lang:$('lang').selectedIndex, dev:$('dev').selectedIndex}
      }));
    }catch(e){}
  },300);
}

function restore(){
  let v=null;
  try{ v=JSON.parse(localStorage.getItem(SAVEKEY)||'null'); }catch(e){}
  if(!v) return false;
  S.L = T[v.L] ? v.L : 'en';
  S.idx = v.idx||0;
  S.notes = v.notes||{}; S.flags = v.flags||{};
  if(v.tasks) Object.keys(S.tasks).forEach(k=>{
    if(v.tasks[k]) S.tasks[k]={base:v.tasks[k].base||0, run:false, from:0, pf:v.tasks[k].pf||null, seq:v.tasks[k].seq||0};
  });
  S.t.base = v.base||0;
  R.lines = v.lines||[];
  document.documentElement.lang = S.L;
  document.documentElement.dir = T[S.L].dir;
  document.querySelectorAll('.langtog button').forEach(b=> b.classList.toggle('on', b.dataset.l===S.L));
  chrome();
  if(v.f){
    $('pid').value=v.f.pid||''; $('mod').value=v.f.mod||'';
    $('seg').value=v.f.seg||''; $('lang').selectedIndex=v.f.lang||0;
    $('dev').selectedIndex=v.f.dev||0;
  }
  const anyTask = Object.keys(S.tasks).some(k=> S.tasks[k].base>0 || S.tasks[k].pf || S.tasks[k].seq);
  return !!(S.t.base>0 || Object.keys(S.notes).length || R.lines.length || anyTask);
}

/* ═══════════════════ EXPORT ═══════════════════ */

function reportData(){
  const u=U(), d=D(), sv=$('seg').value, pid=$('pid').value||'P-XX';
  const seg = d.segs.find(s=>s[0]===sv);
  const meta=[
    [u.xParticipant, pid],
    [u.xSegment, seg?seg[2]:'—'],
    [u.xModerator, $('mod').value||'—'],
    [u.xLang, $('lang').value],
    [u.xDev, $('dev').value],
    [u.xDur, fmt(elapsed())],
    [u.xDate, new Date().toLocaleString(S.L==='ar'?'ar-AE':'en-GB')]
  ];
  const sections=[];
  d.main.forEach(p=>{
    if(!p.qs.length) return;
    sections.push({
      head:(S.L==='ar'?'القسم ':'Section ')+p.id+' — '+p.title,
      qs: p.qs.map(q=>({n:'Q'+q[0], t:q[1], route:q[3]?(q[3].toUpperCase().replace('PHASE2','PHASE 2')+' → '+(q[4]||'')):'', note:S.notes['q:'+q[0]]||'', flag:!!S.flags['q:'+q[0]]}))
    });
  });
  const up = d.main.find(p=>p.tasks);
  const tasks = up ? up.tasks.map(t=>{
    const st=S.tasks[t[0]];
    return {id:t[0], title:t[1], time:fmt(tElapsed(t[0])), pf:st.pf?u[st.pf]:'—', seq:st.seq||'—',
      note:S.notes['t:'+t[0]]||'', flag:!!S.flags['t:'+t[0]]};
  }) : [];
  const surprises = Object.keys(S.flags).filter(k=>S.flags[k]).map(k=>({
    n:(k.indexOf('q:')===0?'Q'+k.slice(2):k.slice(2)), note:S.notes[k]||''
  }));
  return {pid:pid, meta:meta, sections:sections, tasks:tasks, surprises:surprises, lines:R.lines};
}

$('exportBtn').onclick = ()=>{
  const u=U(), r=reportData(), L=[];
  L.push('# EDE — '+u.reportSub+' · '+r.pid); L.push('');
  L.push('| | |'); L.push('|---|---|');
  r.meta.forEach(m=> L.push('| '+m[0]+' | '+m[1]+' |'));
  L.push('');
  L.push('---'); L.push(''); L.push('## '+u.xInterview); L.push('');
  r.sections.forEach(sec=>{
    L.push('### '+sec.head); L.push('');
    sec.qs.forEach(q=>{
      L.push('**'+q.n+'. '+q.t+'**'+(q.flag?'  '+u.xSurprise:''));
      if(q.route) L.push('`'+q.route+'`');
      L.push('');
      L.push((q.note||u.xNoNotes).split('\n').map(x=>'> '+x).join('\n'));
      L.push('');
    });
  });
  if(r.tasks.length){
    L.push('---'); L.push(''); L.push('## '+u.xUsability); L.push('');
    L.push('| | '+u.xTime+' | '+u.xResult+' | '+u.xSeq+' |');
    L.push('|---|---|---|---|');
    r.tasks.forEach(t=> L.push('| **'+t.id+'** '+t.title+(t.flag?' '+u.xSurprise:'')+' | '+t.time+' | '+t.pf+' | '+t.seq+' |'));
    L.push('');
    r.tasks.forEach(t=>{
      if(!t.note) return;
      L.push('**'+t.id+'**'); L.push('');
      L.push(t.note.split('\n').map(x=>'> '+x).join('\n')); L.push('');
    });
  }
  if(r.surprises.length){
    L.push('---'); L.push(''); L.push('## '+u.surprises); L.push('');
    L.push('_'+u.surprisesNote+'_'); L.push('');
    r.surprises.forEach(s=> L.push('- **'+s.n+'** — '+s.note.replace(/\n/g,' / ')));
    L.push('');
  }
  if(r.lines.length){
    L.push('---'); L.push(''); L.push('## '+u.xTranscript); L.push('');
    r.lines.forEach(l=> L.push('- `'+l.at+'` '+l.tx));
    L.push('');
  }
  const blob=new Blob([L.join('\n')],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='EDE_'+r.pid.replace(/\s+/g,'-')+'_'+S.L.toUpperCase()+'.md';
  a.click();
  toast(u.toastExport);
};
